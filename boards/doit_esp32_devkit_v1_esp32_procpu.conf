# Board-specific Kconfig fragment for the classic ESP32 (doit_esp32_devkit_v1/esp32/procpu).
# Merged after prj.conf by the Zephyr build system.

# The classic ESP32 only has ~192 KB of usable app DRAM (dram0_0_seg) and the
# Zephyr + Wi-Fi stack already consumes ~95% of it. The quirc decoder needs at
# least ~17 KB of libc malloc heap (the free RAM between _end and _heap_sentry),
# of which only ~10 KB is left. On-device QR decoding is therefore not feasible
# here: the web page falls back to local (jsQR) decoding.
# RELIC_QR_DECODE_SERVER is opt-in (default n), so it is already off here;
# this line just documents that decision explicitly.
# CONFIG_RELIC_QR_DECODE_SERVER is not set

# Shrink the kernel heap pool to give back RAM to the rest of the system.
CONFIG_HEAP_MEM_POOL_SIZE=16384

# The image dimension is only used by on-device decoding (disabled above), so
# this value is inert on the V1. Kept for documentation / uniformity.
CONFIG_RELIC_QR_DECODE_MAX_DIM=192
